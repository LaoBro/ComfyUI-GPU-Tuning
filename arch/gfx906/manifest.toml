# gfx906 (MI50 / MI60 / Radeon VII) measurement manifest.
#
# Measured on gfx906 with tools/bench.py and shipped so the arch works from
# one install: the node reads feature.* / int8_gemm.tile / attention.* straight
# from here. Records are grade = "measured" and the fingerprint is left as
# "unmeasured": it matches every build of this arch. A local
# bench (tools/bench.py --all --write) overwrites these records per shape;
# delete the local override to fall back to this file.
#
# Regenerate with:
#   python tools/bench.py --site int8_gemv.m1 --site w4a8.m1 --write

schema = 1

[arch]
gcn = "gfx906"
fingerprint = "unmeasured"
capabilities = ["v_dot4_i32_i8", "v_perm_b32"]
note = "60 CU, wave64; transcribed from PORTING.md, not re-measured here"

# 4-bit weight GEMV, one to eight rows. `ms` keeps every implementation that was
# timed, so a later run can show what changed instead of a single winner.

[sites."w4a8.m1"]
default = "asm"
default_grade = "measured"

[sites."w4a8.m1".shapes]
"4096x4096@m1" = { impl = "asm", ms = { asm = 0.129599, int8 = 0.125439, sum = 0.259358, triton = 0.535356 }, rel = 1.11e-02, grade = "measured", date = "2026-11-03", note = "convrot off, weight group 128" }
"4096x4096@m8" = { impl = "asm", ms = { asm = 0.219359, int8 = 0.625755, sum = 0.864634, triton = 0.540316 }, rel = 8.83e-03, grade = "measured", date = "2026-11-03", note = "convrot off, weight group 128" }
"12288x4096@m1" = { impl = "asm", ms = { asm = 0.154079, int8 = 0.158559, sum = 0.405437, triton = 0.999192 }, rel = 9.21e-03, grade = "measured", date = "2026-11-03", note = "convrot off, weight group 128" }
"12288x4096@m8" = { impl = "asm", ms = { asm = 0.371197, int8 = 1.18927, sum = 2.40382, triton = 1.00479 }, rel = 8.20e-03, grade = "measured", date = "2026-11-03", note = "convrot off, weight group 128" }

[sites."int8_gemv.m1"]
default = "asm"
default_grade = "measured"

[sites."int8_gemv.m1".shapes]
"4096x4096@m1" = { impl = "asm", ms = { asm = 0.125119, int8 = 0.490236, triton = 0.139519 }, rel = 6.88e-03, grade = "measured", date = "2026-11-03", note = "convrot off" }
"4096x12288@m1" = { impl = "asm", ms = { asm = 0.168158, int8 = 1.11951, triton = 0.192959 }, rel = 8.87e-03, grade = "measured", date = "2026-11-03", note = "convrot off" }
"12288x4096@m1" = { impl = "asm", ms = { asm = 0.165118, int8 = 0.942552, triton = 0.180799 }, rel = 7.58e-03, grade = "measured", date = "2026-11-03", note = "convrot off" }
"152064x4096@m1" = { impl = "asm", ms = { asm = 0.844633, int8 = 6.37483, triton = 0.915513 }, rel = 7.53e-03, grade = "measured", date = "2026-11-03", note = "convrot off" }

[sites."feature.gemv"]
default = "on"
default_grade = "measured"

[sites."feature.w4a8"]
default = "on"
default_grade = "measured"

[sites."int8_gemm.tile".shapes]
"large" = { impl = "block_m=128,block_n=256,block_k=64,group_size_m=8,warps=8,stages=3", ms = { 128x128x32g8w4s4 = 1.36831, 128x256x32g8w4s2 = 1.44623, 128x256x64g8w8s3 = 1.22735, 128x32x32g8w4s4 = 1.82447, 128x64x32g8w4s4 = 1.86143, 16x32x64g8w4s3 = 1.76095, 64x128x32g8w4s4 = 1.89534, 64x256x32g8w4s4 = 1.62655 }, grade = "measured", date = "2026-11-03", note = "3 cell(s), convrot on" }
"small" = { impl = "block_m=16,block_n=32,block_k=64,group_size_m=8,warps=4,stages=3", ms = { 128x128x32g8w4s4 = 1.28039, 128x256x32g8w4s2 = 1.48383, 128x256x64g8w8s3 = 1.26223, 128x32x32g8w4s4 = 1.53991, 128x64x32g8w4s4 = 1.66135, 16x32x64g8w4s3 = 0.520876, 64x128x32g8w4s4 = 1.11287, 64x256x32g8w4s4 = 1.33663 }, grade = "measured", date = "2026-11-03", note = "6 cell(s), convrot on" }

[sites."feature.vae"]
