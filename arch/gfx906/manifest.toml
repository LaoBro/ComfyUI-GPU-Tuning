# gfx906 (MI50 / MI60 / Radeon VII) measurement manifest.
#
# Measured on gfx906 with tools/bench.py and shipped so the arch works from
# one install: the node reads feature.* / int8_gemm.tile / convrot.mode and the
# GEMV backend choices straight from here. Records are grade = "measured" and
# the fingerprint is left as "unmeasured": it matches every build of this arch.
# A local bench (tools/bench.py --all --write) overwrites these records per
# shape; delete the local override to fall back to this file.
#
# Regenerate with, then set fingerprint back to "unmeasured":
#   python tools/bench.py --all --write --out arch/gfx906/manifest.toml

schema = 1

[arch]
gcn = "gfx906"
fingerprint = "unmeasured"
capabilities = ["v_dot4_i32_i8", "v_perm_b32"]
note = "60 CU, wave64; measured 2026-11-05 under rocm7.18.26441, torch2.15.0+rocm10.3.0a20261104, triton3.9.0"

# 4-bit weight GEMV, one to eight rows. `ms` keeps every implementation that was
# timed, so a later run can show what changed instead of a single winner.

[sites."w4a8.m1"]
default = "asm"
default_grade = "measured"

[sites."w4a8.m1".shapes]
"4096x4096@m1" = { impl = "asm", ms = { asm = 0.11744, int8 = 0.11232, sum = 0.248482, triton = 0.498563 }, rel = 1.16e-02, grade = "measured", date = "2026-11-05", note = "convrot off, weight group 128" }
"4096x4096@m8" = { impl = "asm", ms = { asm = 0.227842, int8 = 0.626243, sum = 0.893606, triton = 0.491043 }, rel = 9.37e-03, grade = "measured", date = "2026-11-05", note = "convrot off, weight group 128" }
"12288x4096@m1" = { impl = "asm", ms = { asm = 0.152161, int8 = 0.151521, sum = 0.410563, triton = 0.994086 }, rel = 1.01e-02, grade = "measured", date = "2026-11-05", note = "convrot off, weight group 128" }
"12288x4096@m8" = { impl = "asm", ms = { asm = 0.376483, int8 = 1.19473, sum = 2.47921, triton = 1.01441 }, rel = 1.34e-02, grade = "measured", date = "2026-11-05", note = "convrot off, weight group 128" }

[sites."int8_gemv.m1"]
default = "asm"
default_grade = "measured"

[sites."int8_gemv.m1".shapes]
"4096x4096@m1" = { impl = "asm", ms = { asm = 0.108161, int8 = 0.480643, triton = 0.124801 }, rel = 6.68e-03, grade = "measured", date = "2026-11-05", note = "convrot off" }
"4096x12288@m1" = { impl = "asm", ms = { asm = 0.157921, int8 = 1.14945, triton = 0.184001 }, rel = 9.23e-03, grade = "measured", date = "2026-11-05", note = "convrot off" }
"12288x4096@m1" = { impl = "asm", ms = { asm = 0.150241, int8 = 0.932166, triton = 0.171201 }, rel = 8.98e-03, grade = "measured", date = "2026-11-05", note = "convrot off" }
"152064x4096@m1" = { impl = "asm", ms = { asm = 0.857125, int8 = 6.33476, triton = 0.913126 }, rel = 1.10e-02, grade = "measured", date = "2026-11-05", note = "convrot off" }

[sites."feature.gemv"]
default = "on"
default_grade = "measured"

[sites."feature.w4a8"]
default = "on"
default_grade = "measured"

[sites."int8_gemm.tile".shapes]
"large" = { impl = "block_m=128,block_n=256,block_k=64,group_size_m=8,warps=8,stages=3", ms = { 128x128x32g8w4s4 = 1.33777, 128x256x32g8w4s2 = 1.32001, 128x256x64g8w8s3 = 1.24049, 128x32x32g8w4s4 = 1.78705, 128x64x32g8w4s4 = 1.85153, 16x32x64g8w4s3 = 1.75041, 64x128x32g8w4s4 = 1.85361, 64x256x32g8w4s4 = 1.58001 }, grade = "measured", date = "2026-11-05", note = "3 cell(s), convrot on" }
"small" = { impl = "block_m=16,block_n=32,block_k=64,group_size_m=8,warps=4,stages=3", ms = { 128x128x32g8w4s4 = 1.28641, 128x256x32g8w4s2 = 1.31201, 128x256x64g8w8s3 = 1.23057, 128x32x32g8w4s4 = 1.52769, 128x64x32g8w4s4 = 1.65865, 16x32x64g8w4s3 = 0.509363, 64x128x32g8w4s4 = 1.07617, 64x256x32g8w4s4 = 1.26585 }, grade = "measured", date = "2026-11-05", note = "6 cell(s), convrot on" }

[sites."feature.vae"]
default = "on"
default_grade = "measured"

# Non-quantized fp16 linear: the self-written v_dot2 GEMM beats rocBLAS on big
# aligned shapes (SDXL UNet linear is 66% of forward; ~1.18x end-to-end measured).
[sites."feature.f16_gemm"]
default = "on"
default_grade = "measured"

[sites."vae.decode".shapes]
"c512x64" = { impl = "conv2d", ms = { conv2d = 0.628644, torch = 2.7541 }, grade = "measured", date = "2026-11-05", note = "depth-1 conv3d, fp16, padding 0" }
"c512x128" = { impl = "conv2d", ms = { conv2d = 2.42322, torch = 7.90901 }, grade = "measured", date = "2026-11-05", note = "depth-1 conv3d, fp16, padding 0" }

[sites."convrot.mode"]
default = "fused"
default_grade = "measured"

[sites."convrot.mode".shapes]
"m1x4096" = { impl = "fused", ms = { butterfly = 0.076481, fused = 0.04592, off = 0.226561 }, grade = "measured", date = "2026-11-05", note = "rotate + quantize, fp16" }
"m128x4096" = { impl = "fused", ms = { butterfly = 0.077281, fused = 0.04656, off = 0.198561 }, grade = "measured", date = "2026-11-05", note = "rotate + quantize, fp16" }

[sites."feature.convrot"]
default = "on"
default_grade = "measured"

# Uniform-grid W4A16 multi-row GEMV: VALU-built levels beat the tab[16] LDS gather
# on this card. The kernel itself keeps the table for m > 4 (M=8 spills at 256 VGPR).
[sites."feature.w4a16_valu"]
default = "on"
default_grade = "measured"

[sites."w4a16.valu".shapes]
"4096x4096@m2" = { impl = "valu", ms = { table = 0.0737387, valu = 0.057049 }, rel = 2.99e-07, grade = "measured", date = "2026-11-07", note = "uniform grid, fp32 activations, deep queue" }
"4096x4096@m4" = { impl = "valu", ms = { table = 0.139042, valu = 0.130002 }, rel = 3.78e-07, grade = "measured", date = "2026-11-07", note = "uniform grid, fp32 activations, deep queue" }
"12288x4096@m2" = { impl = "valu", ms = { table = 0.137921, valu = 0.131256 }, rel = 2.12e-06, grade = "measured", date = "2026-11-07", note = "uniform grid, fp32 activations, deep queue" }
"12288x4096@m4" = { impl = "valu", ms = { table = 0.307734, valu = 0.289908 }, rel = 2.04e-06, grade = "measured", date = "2026-11-07", note = "uniform grid, fp32 activations, deep queue" }

